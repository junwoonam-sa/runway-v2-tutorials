{{- if .Values.runway.credentials.create }}
{{/*
  차트가 Secret을 만드는 경로입니다. **권장하지 않습니다** — 여기 넣은 값은
  values.yaml에 남고, Argo CD 리소스 트리에서 애플리케이션을 볼 수 있는 사람 모두에게
  보입니다. OpenBao 주입(runway.openbao.*)이나 미리 만든 Secret을 쓰세요.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-credentials" (include "llm-tutorial.fullname" .) }}
  labels:
    {{- include "llm-tutorial.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.runway.credentials.data.LLM_API_KEY | quote }}
  {{- if .Values.runway.credentials.data.ACCESS_PASSWORD }}
  ACCESS_PASSWORD: {{ .Values.runway.credentials.data.ACCESS_PASSWORD | quote }}
  {{- end }}
{{- end }}
