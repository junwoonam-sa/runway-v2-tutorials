<svg xmlns="http://www.w3.org/2000/svg" width="600" height="252" viewBox="0 0 600 252"
     role="img" aria-labelledby="tp-title tp-desc"
     font-family="'IBM Plex Sans KR', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <title id="tp-title">태그를 밀면 게시되는 두 가지</title>
  <desc id="tp-desc">git 태그를 밀면 컨테이너 이미지가 ghcr.io에, Helm 차트가 github.io의 gh-pages 브랜치에 게시됩니다. 3-1에서 등록하는 것은 차트 주소입니다.</desc>

  <defs>
    <marker id="tp-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="60" y="20" width="480" height="44" rx="3"
        fill="var(--accent-soft, #d7ecec)" fill-opacity="0.45"
        stroke="var(--accent, #0c6a72)" stroke-width="1"/>
  <text x="300" y="42" text-anchor="middle" dominant-baseline="central" font-size="13"
        font-family="'IBM Plex Mono', SFMono-Regular, Consolas, monospace"
        fill="var(--ink, #0f171d)">git tag v0.1.0 &amp;&amp; git push origin v0.1.0</text>

  <g stroke="var(--ink-mute, #6d7d87)" stroke-width="1" fill="none">
    <path d="M300 66 L300 90 L160 90 L160 114" marker-end="url(#tp-arrow)"/>
    <path d="M300 66 L300 90 L440 90 L440 114" marker-end="url(#tp-arrow)"/>
  </g>

  <g fill="var(--ground, #fbfcfd)" stroke="var(--line, #d9e2e7)" stroke-width="1">
    <rect x="20" y="118" width="280" height="76" rx="3"/>
    <rect x="300" y="118" width="280" height="76" rx="3"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="160" y="140" font-size="14" fill="var(--ink, #0f171d)">컨테이너 이미지</text>
    <text x="440" y="140" font-size="14" fill="var(--ink, #0f171d)">Helm 차트</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central" font-size="11.5"
     font-family="'IBM Plex Mono', SFMono-Regular, Consolas, monospace"
     fill="var(--ink-soft, #46555f)">
    <text x="160" y="163">ghcr.io/&lt;계정&gt;/</text>
    <text x="160" y="181">runway-llm-tutorial:0.1.0</text>
    <text x="440" y="163">&lt;계정&gt;.github.io/</text>
    <text x="440" y="181">runway-llm-tutorial</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central" font-size="12"
     fill="var(--ink-mute, #6d7d87)">
    <text x="160" y="212">파드가 이것을 받아 실행합니다</text>
    <text x="440" y="212">gh-pages 브랜치에 index.yaml + .tgz</text>
  </g>
  <text x="440" y="232" text-anchor="middle" dominant-baseline="central" font-size="12"
        fill="var(--accent-ink, #0a565d)">← 3-1에서 등록하는 주소</text>
</svg>
