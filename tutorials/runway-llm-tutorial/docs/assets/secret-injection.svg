<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180"
     role="img" aria-labelledby="inj-title inj-desc"
     font-family="'IBM Plex Sans KR', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <title id="inj-title">OpenBao의 JSON이 컨테이너 안 파일로 펼쳐지는 모습</title>
  <desc id="inj-desc">OpenBao의 tutorial/llmchat에 저장한 JSON이, 컨테이너 안 /vault/secrets/llmchat.env 파일에서 KEY=VALUE 한 줄씩으로 펼쳐집니다. JSON의 키 이름이 그대로 왼쪽에 옵니다.</desc>

  <defs>
    <marker id="inj-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-size="12" fill="var(--ink-mute, #6d7d87)" text-anchor="middle">
    <text x="135" y="22">OpenBao의</text>
    <text x="135" y="40">tutorial/llmchat</text>
    <text x="465" y="22">컨테이너 안</text>
    <text x="465" y="40">/vault/secrets/llmchat.env</text>
  </g>

  <rect x="20" y="56" width="230" height="104" rx="3"
        fill="var(--accent-soft, #d7ecec)" fill-opacity="0.45"
        stroke="var(--accent, #0c6a72)" stroke-width="1"/>
  <rect x="350" y="56" width="230" height="104" rx="3"
        fill="var(--ground, #fbfcfd)" stroke="var(--line, #d9e2e7)" stroke-width="1"/>

  <g font-family="'IBM Plex Mono', SFMono-Regular, Consolas, monospace"
     font-size="12" fill="var(--ink-soft, #46555f)">
    <text x="34" y="80">{</text>
    <text x="34" y="100">  "LLM_API_KEY": "sk-…",</text>
    <text x="34" y="120">  "ACCESS_PASSWORD": "…"</text>
    <text x="34" y="140">}</text>
    <text x="364" y="98">LLM_API_KEY=sk-xxxxxxxx</text>
    <text x="364" y="118">ACCESS_PASSWORD=긴문자열</text>
  </g>

  <line x1="258" y1="108" x2="342" y2="108"
        stroke="var(--ink-mute, #6d7d87)" stroke-width="1" marker-end="url(#inj-arrow)"/>
</svg>
