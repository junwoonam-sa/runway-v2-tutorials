<svg xmlns="http://www.w3.org/2000/svg" width="600" height="116" viewBox="0 0 600 116"
     role="img" aria-labelledby="ord-title ord-desc"
     font-family="'IBM Plex Sans KR', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <title id="ord-title">값이 필요한 순서</title>
  <desc id="ord-desc">차트 값으로 앱을 만들고, 앱이 뜬 다음에 OpenBao의 값이 파일로 도착합니다. PVC 이름과 엔진 이름은 앱을 만들 때 있어야 하므로 OpenBao에 넣으면 늦습니다.</desc>

  <defs>
    <marker id="ord-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="var(--ground, #fbfcfd)" stroke="var(--line, #d9e2e7)" stroke-width="1">
    <rect x="20" y="30" width="120" height="44" rx="3"/>
    <rect x="170" y="30" width="120" height="44" rx="3"/>
    <rect x="320" y="30" width="120" height="44" rx="3"/>
  </g>
  <rect x="470" y="30" width="120" height="44" rx="3"
        fill="var(--accent-soft, #d7ecec)" fill-opacity="0.45"
        stroke="var(--accent, #0c6a72)" stroke-width="1"/>

  <g font-size="14" fill="var(--ink, #0f171d)" text-anchor="middle" dominant-baseline="central">
    <text x="80" y="52">차트 값</text>
    <text x="230" y="52">앱을 만든다</text>
    <text x="380" y="52">앱이 뜬다</text>
    <text x="530" y="52">값이 파일로 도착</text>
  </g>

  <g stroke="var(--ink-mute, #6d7d87)" stroke-width="1" marker-end="url(#ord-arrow)">
    <line x1="146" y1="52" x2="164" y2="52"/>
    <line x1="296" y1="52" x2="314" y2="52"/>
    <line x1="446" y1="52" x2="464" y2="52"/>
  </g>

  <g font-size="12" fill="var(--ink-mute, #6d7d87)" dominant-baseline="central">
    <text x="20" y="96">PVC 이름과 엔진 이름은 여기 있어야 합니다</text>
    <text x="590" y="96" text-anchor="end">여기서는 이미 늦습니다</text>
  </g>
</svg>
