<svg xmlns="http://www.w3.org/2000/svg" width="600" height="214" viewBox="0 0 600 214"
     role="img" aria-labelledby="qd-title qd-desc"
     font-family="'IBM Plex Sans KR', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <title id="qd-title">문서를 넣어 두는 흐름과 질문에 답하는 흐름</title>
  <desc id="qd-desc">문서를 올리면 문단으로 쪼개져 Qdrant에 저장됩니다. 질문이 들어오면 저장해 둔 문단 중 관련 있는 것 몇 개를 꺼내고, AI가 그것을 보고 답합니다.</desc>

  <defs>
    <marker id="qd-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-size="12" fill="var(--ink-mute, #6d7d87)" dominant-baseline="central">
    <text x="20" y="28">미리 해 두는 일</text>
    <text x="20" y="134">질문할 때</text>
  </g>

  <g fill="var(--ground, #fbfcfd)" stroke="var(--line, #d9e2e7)" stroke-width="1">
    <rect x="20" y="44" width="150" height="44" rx="3"/>
    <rect x="210" y="44" width="150" height="44" rx="3"/>
    <rect x="20" y="150" width="160" height="44" rx="3"/>
    <rect x="210" y="150" width="150" height="44" rx="3"/>
    <rect x="400" y="150" width="180" height="44" rx="3"/>
  </g>
  <rect x="400" y="44" width="180" height="44" rx="3"
        fill="var(--accent-soft, #d7ecec)" fill-opacity="0.45"
        stroke="var(--accent, #0c6a72)" stroke-width="1"/>

  <g font-size="14" fill="var(--ink, #0f171d)" text-anchor="middle" dominant-baseline="central">
    <text x="95" y="66">문서 올리기</text>
    <text x="285" y="66">문단으로 쪼갬</text>
    <text x="490" y="66">Qdrant에 저장</text>
    <text x="100" y="172">"휴가 며칠이야?"</text>
    <text x="285" y="172">관련 문단 몇 개</text>
    <text x="490" y="172">AI가 보고 답변</text>
  </g>

  <g stroke="var(--ink-mute, #6d7d87)" stroke-width="1" fill="none" marker-end="url(#qd-arrow)">
    <line x1="176" y1="66" x2="204" y2="66"/>
    <line x1="366" y1="66" x2="394" y2="66"/>
    <line x1="186" y1="172" x2="204" y2="172"/>
    <line x1="366" y1="172" x2="394" y2="172"/>
    <path d="M490 94 L490 119 L285 119 L285 144"/>
  </g>
</svg>
