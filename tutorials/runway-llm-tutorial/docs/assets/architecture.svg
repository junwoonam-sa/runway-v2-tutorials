<svg xmlns="http://www.w3.org/2000/svg" width="600" height="536" viewBox="0 0 600 536"
     role="img" aria-labelledby="arch-title arch-desc"
     font-family="'IBM Plex Sans KR', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <title id="arch-title">챗봇 애플리케이션 구조</title>
  <desc id="arch-desc">브라우저가 챗봇 애플리케이션에 접속합니다. 그 안에서 웹 서버, 에이전트, MCP 도구 서버가 함께 돕니다. 에이전트는 AI 게이트웨이를 부르고, MCP 도구 서버는 Qdrant를 부릅니다.</desc>

  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g stroke="var(--ink-mute, #6d7d87)" stroke-width="1" marker-end="url(#arch-arrow)" fill="none">
    <line x1="300" y1="66" x2="300" y2="132"/>
    <line x1="300" y1="198" x2="300" y2="232"/>
    <line x1="300" y1="294" x2="300" y2="328"/>
    <path d="M200 264 L130 264 L130 456"/>
    <path d="M400 360 L470 360 L470 456"/>
  </g>

  <rect x="210" y="20" width="180" height="44" rx="3"
        fill="var(--ground, #fbfcfd)" stroke="var(--line, #d9e2e7)" stroke-width="1"/>
  <text x="300" y="42" text-anchor="middle" dominant-baseline="central"
        font-size="14" fill="var(--ink, #0f171d)">브라우저</text>

  <rect x="60" y="90" width="480" height="330" rx="6"
        fill="var(--accent-soft, #d7ecec)" fill-opacity="0.45"
        stroke="var(--accent, #0c6a72)" stroke-width="1"/>
  <text x="80" y="116" dominant-baseline="central"
        font-size="14" fill="var(--accent-ink, #0a565d)">챗봇 애플리케이션 — 배포되는 것은 이것 하나</text>

  <g fill="var(--ground, #fbfcfd)" stroke="var(--line, #d9e2e7)" stroke-width="1">
    <rect x="200" y="140" width="200" height="56" rx="3"/>
    <rect x="200" y="236" width="200" height="56" rx="3"/>
    <rect x="200" y="332" width="200" height="56" rx="3"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="300" y="161" font-size="14" fill="var(--ink, #0f171d)">웹 서버</text>
    <text x="300" y="180" font-size="12" fill="var(--ink-mute, #6d7d87)">화면과 API</text>
    <text x="300" y="257" font-size="14" fill="var(--ink, #0f171d)">에이전트</text>
    <text x="300" y="276" font-size="12" fill="var(--ink-mute, #6d7d87)">도구를 쓸지 판단</text>
    <text x="300" y="353" font-size="14" fill="var(--ink, #0f171d)">MCP 도구 서버</text>
    <text x="300" y="372" font-size="12" fill="var(--ink-mute, #6d7d87)">문서 색인과 검색</text>
  </g>

  <g fill="var(--sunken, #e8eef1)" stroke="var(--line, #d9e2e7)" stroke-width="1">
    <rect x="40" y="460" width="180" height="56" rx="3"/>
    <rect x="380" y="460" width="180" height="56" rx="3"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="130" y="481" font-size="14" fill="var(--ink, #0f171d)">AI 게이트웨이</text>
    <text x="130" y="500" font-size="12" fill="var(--ink-mute, #6d7d87)">플랫폼이 운영</text>
    <text x="470" y="481" font-size="14" fill="var(--ink, #0f171d)">Qdrant</text>
    <text x="470" y="500" font-size="12" fill="var(--ink-mute, #6d7d87)">내가 설치하는 벡터 DB</text>
  </g>
</svg>
