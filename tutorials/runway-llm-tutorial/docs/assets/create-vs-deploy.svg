<svg xmlns="http://www.w3.org/2000/svg" width="600" height="254" viewBox="0 0 600 254"
     role="img" aria-labelledby="cvd-title cvd-desc"
     font-family="'IBM Plex Sans KR', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <title id="cvd-title">생성과 배포는 다릅니다</title>
  <desc id="cvd-desc">생성을 누르면 목록에 이름만 나타나고 아직 아무것도 실행되지 않습니다. 상세 화면을 열어 배포를 눌러야 실행되고 상태가 Healthy가 됩니다.</desc>

  <defs>
    <marker id="cvd-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="var(--ground, #fbfcfd)" stroke="var(--line, #d9e2e7)" stroke-width="1">
    <rect x="60" y="30" width="140" height="44" rx="3"/>
    <rect x="240" y="26" width="250" height="52" rx="3"/>
    <rect x="60" y="110" width="140" height="44" rx="3"/>
    <rect x="240" y="190" width="110" height="44" rx="3"/>
  </g>
  <rect x="60" y="190" width="140" height="44" rx="3"
        fill="var(--accent-soft, #d7ecec)" fill-opacity="0.45"
        stroke="var(--accent, #0c6a72)" stroke-width="1"/>
  <rect x="390" y="190" width="150" height="44" rx="3"
        fill="var(--ok-soft, #dcefe5)" fill-opacity="0.6"
        stroke="var(--ok, #16694c)" stroke-width="1"/>

  <g font-size="14" fill="var(--ink, #0f171d)" text-anchor="middle" dominant-baseline="central">
    <text x="130" y="52">생성</text>
    <text x="365" y="44">목록에 나타남</text>
    <text x="130" y="132">상세 화면 열기</text>
    <text x="130" y="212">배포</text>
    <text x="295" y="212">실행됨</text>
    <text x="465" y="212">상태 Healthy</text>
  </g>
  <text x="365" y="62" font-size="12" fill="var(--ink-mute, #6d7d87)"
        text-anchor="middle" dominant-baseline="central">아직 아무것도 실행되지 않았습니다</text>

  <g stroke="var(--ink-mute, #6d7d87)" stroke-width="1" fill="none" marker-end="url(#cvd-arrow)">
    <line x1="206" y1="52" x2="234" y2="52"/>
    <line x1="130" y1="74" x2="130" y2="106"/>
    <line x1="130" y1="154" x2="130" y2="186"/>
    <line x1="206" y1="212" x2="234" y2="212"/>
    <line x1="356" y1="212" x2="384" y2="212"/>
  </g>
</svg>
