<svg xmlns="http://www.w3.org/2000/svg" width="600" height="412" viewBox="0 0 600 412"
     role="img" aria-labelledby="ag-title ag-desc"
     font-family="'IBM Plex Sans KR', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <title id="ag-title">질문 하나에 에이전트가 스스로 도구를 부르는 과정</title>
  <desc id="ag-desc">질문이 들어오면 AI가 저장된 문서를 봐야 한다고 스스로 판단하고, search_documents 도구를 부르고, 벡터 DB에서 관련 문단을 찾아와 그것을 근거로 답합니다. 도구를 부르라고 시킨 사람은 없습니다.</desc>

  <defs>
    <marker id="ag-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="var(--ground, #fbfcfd)" stroke="var(--line, #d9e2e7)" stroke-width="1">
    <rect x="20" y="20" width="300" height="44" rx="3"/>
    <rect x="20" y="184" width="300" height="56" rx="3"/>
    <rect x="20" y="272" width="300" height="44" rx="3"/>
    <rect x="20" y="348" width="300" height="44" rx="3"/>
  </g>
  <rect x="20" y="96" width="300" height="56" rx="3"
        fill="var(--accent-soft, #d7ecec)" fill-opacity="0.45"
        stroke="var(--accent, #0c6a72)" stroke-width="1"/>

  <g text-anchor="middle" dominant-baseline="central" fill="var(--ink, #0f171d)">
    <text x="170" y="42" font-size="14">질문 — "연차가 며칠이야?"</text>

    <text x="170" y="114" font-size="14">AI가 스스로 판단합니다</text>
    <text x="170" y="134" font-size="12" fill="var(--ink-mute, #6d7d87)">"이건 저장된 문서를 봐야겠다"</text>

    <text x="170" y="202" font-size="14">도구 호출</text>
    <text x="170" y="222" font-size="12" fill="var(--ink-mute, #6d7d87)"
          font-family="'IBM Plex Mono', SFMono-Regular, Consolas, monospace">search_documents("연차")</text>

    <text x="170" y="294" font-size="14">벡터 DB에서 관련 문단을 찾아옴</text>
    <text x="170" y="370" font-size="14">그 문단을 근거로 답변</text>
  </g>

  <g stroke="var(--ink-mute, #6d7d87)" stroke-width="1" fill="none" marker-end="url(#ag-arrow)">
    <line x1="170" y1="66" x2="170" y2="92"/>
    <line x1="170" y1="154" x2="170" y2="180"/>
    <line x1="170" y1="242" x2="170" y2="268"/>
    <line x1="170" y1="318" x2="170" y2="344"/>
  </g>

  <path d="M320 124 L344 124" fill="none" stroke="var(--accent, #0c6a72)" stroke-width="1"/>
  <g font-size="12" fill="var(--accent-ink, #0a565d)" dominant-baseline="central">
    <text x="352" y="116">우리가 시킨 것이 아닙니다.</text>
    <text x="352" y="134">AI가 스스로 고른 것입니다.</text>
  </g>
</svg>
